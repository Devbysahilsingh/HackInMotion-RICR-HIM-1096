<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Farm Setup Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#390b0e",
                        "tertiary-fixed-dim": "#ffb3b3",
                        "secondary": "#765749",
                        "outline": "#707973",
                        "on-primary-fixed": "#002114",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f0f1f2",
                        "primary-container": "#2d6a4f",
                        "secondary-fixed": "#ffdbcc",
                        "primary-fixed-dim": "#95d4b3",
                        "on-primary-fixed-variant": "#0e5138",
                        "surface-tint": "#2c694e",
                        "secondary-fixed-dim": "#e6bead",
                        "surface-container": "#edeeef",
                        "secondary-container": "#fed4c2",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1d",
                        "surface-container-low": "#f3f4f5",
                        "tertiary": "#713638",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#a8e7c5",
                        "on-tertiary-fixed-variant": "#6f3537",
                        "tertiary-container": "#8d4d4e",
                        "outline-variant": "#bfc9c1",
                        "surface-variant": "#e1e3e4",
                        "background": "#f8f9fa",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "inverse-primary": "#95d4b3",
                        "on-surface-variant": "#404943",
                        "on-secondary-container": "#795a4c",
                        "on-tertiary-container": "#ffcfce",
                        "surface-dim": "#d9dadb",
                        "surface-container-high": "#e7e8e9",
                        "primary": "#0f5238",
                        "on-secondary-fixed-variant": "#5c4033",
                        "surface": "#f8f9fa",
                        "tertiary-fixed": "#ffdad9",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e1e3e4",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed": "#b1f0ce",
                        "on-background": "#191c1d",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#2c160b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "container-max": "1280px",
                        "touch-target-min": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["22px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation (Onboarding - Close action, minimal) -->
<header class="w-full top-0 sticky shadow-sm bg-surface dark:bg-on-background z-40">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop py-4 w-full container mx-auto max-w-container-max">
<button aria-label="Close setup" class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim font-semibold text-center flex-1">
                Setup
            </div>
<div class="w-[48px]"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop container mx-auto max-w-[600px] w-full">
<!-- Progress Indicator -->
<div class="w-full mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-lg text-label-lg text-primary">Step 1 of 3</span>
<span class="font-label-md text-label-md text-on-surface-variant">Basic Info</span>
</div>
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Header -->
<div class="w-full text-left mb-8">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-2">Tell us about your farm</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">We'll use this to tailor your dashboard and recommendations.</p>
</div>
<!-- Form Canvas -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-6 md:p-8 space-y-6">
<!-- Farm Name -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="farm-name">Farm Name</label>
<input class="w-full h-[48px] px-4 rounded-lg border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary-fixed text-on-background font-body-md placeholder:text-on-surface-variant/50 transition-shadow" id="farm-name" name="farm-name" placeholder="e.g. Sunny Vale Farm" type="text"/>
</div>
<!-- Location -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="location">Location</label>
<div class="flex gap-2">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="w-full h-[48px] pl-10 pr-4 rounded-lg border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary-fixed text-on-background font-body-md placeholder:text-on-surface-variant/50 transition-shadow" id="location" name="location" placeholder="City, Region" type="text"/>
</div>
<button class="h-[48px] px-4 bg-secondary-container text-on-secondary-container rounded-lg hover:bg-secondary-fixed transition-colors font-label-lg text-label-lg flex items-center gap-2 active:scale-95 whitespace-nowrap" type="button">
<span class="material-symbols-outlined">my_location</span>
<span class="hidden sm:inline">Use My Location</span>
</button>
</div>
</div>
<!-- Land Size -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="land-size">Total Land Size</label>
<div class="flex gap-2">
<input class="flex-1 h-[48px] px-4 rounded-lg border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary-fixed text-on-background font-body-md placeholder:text-on-surface-variant/50 transition-shadow" id="land-size" name="land-size" placeholder="0.00" type="number"/>
<select class="w-[120px] h-[48px] px-4 rounded-lg border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary-fixed text-on-background font-body-md cursor-pointer transition-shadow">
<option value="acres">Acres</option>
<option value="hectares">Hectares</option>
<option value="sqft">Sq Ft</option>
</select>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full mt-8 flex justify-end">
<button class="min-w-[140px] h-[48px] bg-primary text-on-primary rounded-lg font-label-lg text-label-lg hover:bg-on-primary-fixed-variant transition-colors shadow-[0px_8px_24px_rgba(0,0,0,0.1)] active:scale-95 flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Suppressed Nav Shells (Transaction/Onboarding intent) -->
<!-- BottomNavBar and SideNav are intentionally excluded as per the Semantic Shell Mandate for Onboarding screens -->
</body></html>
