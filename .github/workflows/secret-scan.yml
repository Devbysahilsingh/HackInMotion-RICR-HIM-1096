# Secret scanning, on every branch.
#
# Split out of ci.yml so the trigger can be `branches: ['**']` without running
# the whole pipeline on every feature push. A secret is leaked by the push that
# carries it, not by the pull request that eventually opens — and this repository
# has several remote branches that were pushed without a PR, so until now the
# only gate on them was the local pre-commit hook. That hook is real, but it
# needs `npm install` to have been run on that clone to be installed at all, and
# `git commit --no-verify` skips it. A server-side scan cannot be skipped.
#
# Two layers, matching .githooks/pre-commit:
#   1. scripts/scan-staged-secrets.mjs — the portable scanner, run over the
#      working tree here rather than the index.
#   2. gitleaks — full history, the default rule set, .gitleaks.toml.
name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Gitleaks scans commits, so a shallow clone would scan almost none.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  portable-scanner:
    name: Portable scanner (tracked tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      # The pre-commit gate reads the staged set; there is none in CI, so it is
      # pointed at everything git tracks. Same rules, wider net: this catches a
      # secret that reached main before the hook existed on someone's clone.
      - name: scan tracked files
        run: node scripts/scan-staged-secrets.mjs --all
