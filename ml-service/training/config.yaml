# Training configuration — the single source every run is reproducible from.
#
# docs/ml/training-plan.md: "all runs reproducible from config + manifest".
# `train.py` hashes this file and records the hash in experiments.md alongside
# the dataset manifest hash, so a row in that log always names the exact inputs
# that produced it.
#
# Values here are the plan's, verbatim, except where a comment says otherwise
# and gives the reason.

seed: 42

data:
  # Split members live in TSVs (path \t CLASS_CODE \t source_dataset), relative
  # to datasets/raw/. Generated by scripts/ml/prepare-datasets.py under
  # ADR-021's curation rules; regenerable, gitignored, hash-pinned in the
  # dataset manifest.
  splits_dir: datasets/splits
  raw_dir: datasets/raw
  manifest: datasets/manifest.json
  # PlantDoc is held out entirely as the field-test domain and is NEVER trained
  # or validated on (curation-rules.json: dataset_roles).
  fieldtest_split: fieldtest

image:
  size: 224
  # Eval path must be byte-identical to ml-service/app/preprocessing.py, which
  # reads these same numbers from the model manifest. The golden-image parity
  # test (P4-6) is what will prove it rather than assert it.
  resize_shortest_side: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Train-only augmentation (docs/ml/dataset-preparation.md, verbatim list).
# torchvision.transforms.v2 rather than albumentations: the plan allows either
# ("torchvision v2 / albumentations") and v2 covers every listed transform, so
# this avoids a dependency and the opencv chain behind it.
augment:
  random_resized_crop_scale: [0.7, 1.0]
  hflip_p: 0.5
  rotation_degrees: 20
  color_jitter: { brightness: 0.3, contrast: 0.3, saturation: 0.2 }
  gaussian_blur_p: 0.15
  random_erasing_p: 0.1

loader:
  batch_size: 32
  # The plan's documented OOM fallback chain. Applied in order, each step
  # logged — "never silent". 4GB of VRAM is genuinely tight for EffNet-B0.
  oom_fallback:
    - { batch_size: 16, grad_accum: 2 }
    - { batch_size: 16, grad_accum: 2, image_size: 192 }
    - { batch_size: 8, grad_accum: 4, image_size: 192 }
  num_workers: 4
  pin_memory: true
  # Windows spawns workers rather than forking, so each one re-imports the
  # module and re-opens the dataset. Persisting them across epochs turns that
  # from a per-epoch cost into a one-off.
  persistent_workers: true
  prefetch_factor: 2

optim:
  name: adamw
  weight_decay: 0.01
  label_smoothing: 0.05
  # Both are the plan's ("class-weighted CE + WeightedRandomSampler"), and they
  # are kept separately switchable on purpose: together they correct the 47:1
  # imbalance TWICE — the sampler rebalances what the model sees, the loss
  # weights rebalance what each sample costs. That is a real over-correction
  # risk toward the rare classes (POTATO_HEALTHY has 79 training images against
  # TOMATO_YELLOW_LEAF_CURL_VIRUS's 3750). Left as specified for Run 0/1;
  # if evaluation shows rare-class over-prediction, turning ONE of these off is
  # the first lever to pull, and the change belongs in experiments.md.
  weighted_sampler: true
  class_weighted_loss: true
  # Softens the weights so the rarest class does not dominate the gradient
  # outright. 0.5 = inverse square root of frequency; 1.0 = plain inverse
  # frequency. Recorded as a choice, not a measurement.
  class_weight_power: 0.5

# ── Calibration policy (P4-4) ────────────────────────────────────────────────
calibration:
  # The criteria in docs/ml/confidence-strategy.md are NON-BINDING for this
  # model: precision-of-accepted at threshold 0 is already 0.9654 against a 0.90
  # floor, and the healthy false-negative rate is already 0.0098 against a 0.05
  # ceiling. Both therefore derive to 0.00, which is a correct application of
  # the rule and an unusable answer — it makes `conf < tau` and the healthy
  # guard unreachable, violating "tau_healthy (stricter)" outright and leaving
  # "Never force a prediction" resting on the margin guard alone. Measured: at
  # tau=0.70 the margin guard uniquely rejects ZERO validation samples, so that
  # leg was carrying nothing.
  #
  # These values are therefore a recorded product DECISION on top of the
  # measurement, not a derivation. `calibrate.py` still derives and reports the
  # raw values, and validates these against every documented criterion before
  # accepting them — an override that failed a gate would be refused.
  policy_override:
    approved: '2026-08-13'
    tau: 0.70
    tau_healthy: 0.80
    reason: >-
      Smallest threshold satisfying every documented requirement simultaneously:
      precision-of-accepted 0.9851 (floor 0.90); inside confidence-strategy.md's
      stated expected neighbourhood 0.70-0.80; tau_healthy strictly greater than
      tau; healthy false-negative rate 0.0037 (ceiling 0.05); healthy-class
      recall 0.9518 (ship gate 0.90); and both the confidence and healthy
      abstention branches genuinely reachable. tau_healthy 0.80 is preferred
      over 0.85 because it gives identical false-negative protection (0.0037 vs
      0.0038) with materially better healthy recall (0.9518 vs 0.9157).
      tau 0.90 is excluded by measurement: it would require tau_healthy > 0.90,
      and every such value fails the healthy-recall ship gate on validation
      (0.8434 at 0.90). Cost: coverage 0.9835 -> 0.9573, i.e. ~2.6 points more
      escalation to the Gemini tier, which is negligible against a 10/day/user
      cap and a 1500/day free tier.

train:
  amp: true
  early_stop_patience: 4 # on val macro-F1
  checkpoint_dir: ml-service/training/checkpoints
  # cudnn.benchmark trades exact reproducibility for speed by letting cuDNN
  # pick algorithms per shape. The plan accepts this and asks that the
  # non-determinism be documented — it is, here and in experiments.md.
  cudnn_benchmark: true

# ── Runs ─────────────────────────────────────────────────────────────────────
# Selected by name: `python train.py --run run0`. Each inherits the blocks
# above and overrides only what the schedule specifies.
runs:
  run0:
    description: ResNet18 sanity — pipeline validation, not a candidate model
    arch: resnet18
    freeze: backbone # head only
    epochs: 3
    lr: 1.0e-3
    scheduler: cosine
    # The gate is a smell test, not a quality bar: chance is 1/35 = 2.9%, and a
    # val accuracy near 100% after three head-only epochs would mean the splits
    # leak rather than that the model is good.
    gates:
      min_val_accuracy: 0.20
      max_val_accuracy: 0.995

  run1:
    description: EffNet-B0 head warmup
    arch: efficientnet_b0
    freeze: backbone
    epochs: 3
    lr: 1.0e-3
    scheduler: cosine

  run2:
    description: EffNet-B0 fine-tune, last 2 blocks + head
    arch: efficientnet_b0
    freeze: partial
    unfreeze_last_blocks: 2
    epochs: 15
    lr: 1.0e-4
    lr_min: 1.0e-5
    scheduler: cosine
    # The plan's schedule is a *sequence*: Run 1 warms the head, Run 2 fine-tunes
    # from it. Without this, Run 2 would start from ImageNet weights with a
    # randomly-initialised head and immediately push large gradients into the
    # backbone it just unfroze — which is exactly the damage the warmup exists to
    # prevent, and the only symptom would be a worse final number.
    # Weights only: a fresh optimizer and cosine schedule, starting at epoch 0.
    init_from: run1
    # Continues an interrupted Run 2 from its OWN last.pt. Takes precedence over
    # init_from, so a resumed run never restarts from Run 1.
    resume: true
