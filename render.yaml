# Render service definition (docs/deployment/backend.md).
#
# Secrets are declared here but never valued here: `sync: false` tells Render
# the variable must be supplied in the dashboard, and keeps it out of git. A
# value written into this file would be a committed credential.
#
# Apply with Render Blueprints (New → Blueprint → point at this repo), or
# create the service manually with the same settings.

services:
  - type: web
    name: him-1096-backend-staging
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    # Render restarts the instance if this stops answering 200.
    healthCheckPath: /healthz
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # PORT is injected by Render; the app reads it and falls back to 4000.

      # ── Required at boot in production ────────────────────────────────
      # The process refuses to start without these, which is deliberate:
      # a misconfigured deploy should fail loudly at boot, not at the first
      # farmer request. Generate the two secrets with `openssl rand -hex 32`.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SERVICE_KEY
        sync: false

      # Exact origins, comma separated. No wildcards — required in production,
      # so a forgotten value fails the boot rather than shipping a broken
      # allowlist (docs/security/api-security.md).
      - key: CORS_ORIGINS
        sync: false

      # ── Optional even in production ───────────────────────────────────
      # Everything below is declared so Render prompts for it, but NONE of it
      # blocks a boot: each subsystem is designed to degrade honestly rather
      # than fail. Leave a value blank in the dashboard and the feature reports
      # its own absence (docs/deployment/environment.md).
      #
      # Phase 2 — weather runs on the keyless Open-Meteo primary (ADR-007:
      # there is no OPENMETEO_* variable by design), and market ingest reports
      # `skipped: 'not_configured'` and serves seeded history (OD-5).
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATAGOVIN_API_KEY
        sync: false
      - key: DATAGOVIN_RESOURCE_ID
        sync: false

      # Phase 3 — the crop-health chain terminates in a LOCAL rule engine, so
      # every tier above it may be absent. CLOUDINARY_URL is the one with no
      # fallback (an upload has nothing to degrade to); without it an analyze
      # request answers UPLOAD_ERROR / errors.uploadStorageUnavailable rather
      # than 500. CLOUDINARY_URL is shape-validated at boot, so a truncated
      # paste fails here rather than at the first farmer upload.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false

      # Operator kill switches. Unlike FORCE_FAIL_*, these ARE honoured in
      # production — that is the point: shed a quota-exhausted or misbehaving
      # tier without a redeploy. Routing-only; no value of any of them touches
      # auth, ownership, validation or rate limiting.
      - key: DISABLE_ML
        value: 'false'
      - key: DISABLE_GEMINI
        value: 'false'
      - key: DISABLE_OPENROUTER
        value: 'false'

      # ── Not yet consumed by any code ──────────────────────────────────
      #   GROQ_API_KEY — P2 voice transcription. Add with `sync: false` when
      #   the subsystem lands; declaring it now would prompt for a secret that
      #   nothing reads.
      #
      # FORCE_FAIL_* / FORCE_SLOW_* failure-injection flags belong on a staging
      # service ONLY and must be absent in production (production checklist).
      # They are inert in production regardless — `isProd` short-circuits every
      # read — but the checklist asserts their absence as defence in depth.
